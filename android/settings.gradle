pluginManagement {

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
        jcenter()
    }
}

plugins {
    id "org.jetbrains.kotlin.android" version "2.2.10" apply false
    id 'com.android.application' version '8.12.1' apply false
    id 'com.android.library' version '8.12.1' apply false
}

rootProject.name = 'qa_flutter_plugin'
